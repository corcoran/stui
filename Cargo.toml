[package]
name = "stui"
version = "0.14.0"
edition = "2024"

[features]
# Render image previews with libchafa in terminals without a graphics protocol.
# Links libchafa (LGPL) dynamically, so the binary needs it at runtime.
chafa = ["ratatui-image/chafa-dyn"]

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["osc52"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
urlencoding = "2.1"
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
dirs = "7.0"
glob = "0.3"
clap = { version = "4.6", features = ["derive"] }
shell-words = "1"
unicode-width = "0.2"
ratatui-image = { version = "11.1", default-features = false, features = ["image-defaults", "crossterm"] }
image = { version = "0.25", default-features = true }
codepage-437 = "0.1"
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
zip = { version = "9.8.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.11"

[build-dependencies]
chrono = "0.4"
